<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snip – short links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0e1633;
    --ink: #14213d;
    --ink-soft: #55627f;
    --cobalt: #2f6bff;
    --cobalt-dark: #1f3bb3;
    --violet: #7a45f0;
    --teal: #19c6c0;
    --gold: #f5c451;
    --error: #b3261e;
    --sans: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  html, body { margin: 0; }
  body {
    color: #fff;
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.55;
    min-height: 100vh;
    padding: clamp(1.5rem, 6vw, 4rem) clamp(1rem, 5vw, 3rem);
    overflow-x: hidden;
  }
  main { max-width: 40rem; margin: 0 auto; }

  /* ---------- Living background ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: linear-gradient(160deg, #0e1633 0%, #1a2466 55%, #2a1f6e 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
  .b1 { width: 36rem; height: 36rem; background: var(--cobalt); opacity: .55; top: -10rem; left: -9rem;
        animation: drift1 22s ease-in-out infinite alternate; }
  .b2 { width: 30rem; height: 30rem; background: #8a4dff; opacity: .5; bottom: -9rem; right: -7rem;
        animation: drift2 27s ease-in-out infinite alternate; }
  .b3 { width: 22rem; height: 22rem; background: var(--teal); opacity: .3; top: 42%; left: 58%;
        animation: drift3 31s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(9rem, 7rem) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-8rem, -6rem) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-10rem, 5rem) scale(.85); } }

  /* ---------- Entrance (one orchestrated sequence) ---------- */
  .rise { animation: rise .8s cubic-bezier(.2, .7, .2, 1) both; animation-delay: var(--d, 0s); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* ---------- Header ---------- */
  .brand { display: flex; align-items: center; gap: .55rem; font-weight: 600; font-size: 1.15rem; margin-bottom: 2.5rem; }
  .brand i { width: .95rem; height: .95rem; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 5px rgba(245, 196, 81, .25); }

  h1 {
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    font-weight: 800;
    line-height: .98;
    letter-spacing: -.03em;
    margin: 0 0 1rem;
  }
  .lede { color: rgba(255, 255, 255, .8); max-width: 30rem; margin: 0 0 1.5rem; }

  /* The memorable moment: a long link types out, then shrinks to a short one. */
  .demo {
    display: flex; align-items: center; gap: .5rem;
    min-height: 2.9rem; margin: 0 0 2rem; padding: .7rem 1rem;
    border-radius: 12px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .2);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-family: var(--mono); font-size: .85rem; color: rgba(255, 255, 255, .82);
  }
  .demo-text { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; }
  .demo-text.is-short { color: var(--gold); font-weight: 600; }
  .caret { flex: none; width: 2px; height: 1.15em; background: var(--gold); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Form card ---------- */
  .card {
    display: flex; flex-direction: column; gap: .75rem;
    background: #fff; color: var(--ink);
    border-radius: 18px;
    padding: clamp(1.25rem, 4vw, 1.75rem);
    box-shadow: 0 30px 70px -25px rgba(5, 10, 50, .8), 0 0 0 1px rgba(255, 255, 255, .6);
  }
  label { font-weight: 600; }
  .row { display: flex; gap: .5rem; }
  input[type="text"] {
    flex: 1; min-width: 0;
    font: inherit; font-family: var(--mono); font-size: .95rem; color: var(--ink);
    background: #f6f8fd;
    border: 2px solid #cfd8ee;
    border-radius: 10px;
    padding: .9rem 1rem;
    transition: border-color .2s, box-shadow .2s, background-color .2s;
  }
  input[type="text"]::placeholder { color: #8a96ad; }
  input[type="text"]:focus { outline: none; border-color: var(--cobalt); background: #fff; box-shadow: 0 0 0 4px rgba(47, 107, 255, .18); }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 10px; border: 2px solid transparent;
    padding: .9rem 1.25rem;
    color: #fff;
    background: linear-gradient(135deg, var(--cobalt), var(--violet));
    background-size: 170% 170%; background-position: 0% 50%;
    position: relative; overflow: hidden;
    box-shadow: 0 12px 26px -12px rgba(76, 78, 240, .9);
    transition: transform .15s ease, box-shadow .2s ease, background-position .45s ease;
  }
  button::after { /* light sweep on hover */
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
    transform: skewX(-20deg); transition: left .6s ease;
  }
  button:hover { background-position: 100% 50%; transform: translateY(-2px); box-shadow: 0 16px 30px -12px rgba(76, 78, 240, 1); }
  button:hover::after { left: 130%; }
  button:active { transform: translateY(1px) scale(.98); box-shadow: 0 6px 14px -8px rgba(76, 78, 240, 1); }
  button:disabled { cursor: progress; transform: none; animation: pan 1.1s linear infinite; }
  @keyframes pan { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }

  button.ghost {
    background: transparent; color: var(--ink); border-color: var(--ink);
    padding: .5rem .9rem; box-shadow: none;
  }
  button.ghost::after { display: none; }
  button.ghost:hover { background: var(--ink); color: #fff; transform: none; box-shadow: none; }

  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .card :focus-visible, .result :focus-visible { outline-color: var(--cobalt); }

  .error { color: var(--error); font-weight: 600; margin: .25rem 0 0; min-height: 1.5em; }

  /* ---------- Result ---------- */
  .result {
    margin-top: 2.25rem;
    background: #fff; color: var(--ink);
    border-radius: 16px;
    padding: 1.4rem 1.4rem 1.2rem;
    position: relative;
    box-shadow: 0 30px 70px -25px rgba(5, 10, 50, .8), 0 0 0 1px rgba(255, 255, 255, .6);
  }
  .result[hidden] { display: none; }
  .result::before { /* gold tape */
    content: ""; position: absolute; top: -.7rem; left: 1.25rem;
    width: 5.5rem; height: 1.3rem; background: var(--gold); border-radius: 2px;
    transform: rotate(-2deg);
  }
  .result.reveal { animation: pop .55s cubic-bezier(.2, .8, .3, 1) both; }
  .result.reveal::before { animation: tape .6s cubic-bezier(.2, .8, .3, 1) .1s both; }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(18px) scale(.97); }
    60% { opacity: 1; transform: translateY(-3px) scale(1.01); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes tape { from { opacity: 0; transform: rotate(-14deg) translateY(-8px); } to { opacity: 1; transform: rotate(-2deg); } }

  .result h2 { font-size: 1rem; font-weight: 600; margin: .4rem 0; color: var(--ink-soft); }
  .short {
    display: block; font-family: var(--mono); font-weight: 600;
    font-size: clamp(1.05rem, 4.4vw, 1.6rem);
    color: var(--cobalt-dark); overflow-wrap: anywhere; text-decoration: none;
  }
  .short:hover { text-decoration: underline; }
  .result.reveal .short { animation: wipe .6s ease-out .15s both; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .original {
    margin: .6rem 0 1rem;
    font-family: var(--mono); font-size: .85rem; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .spark { position: absolute; left: 4rem; top: 0; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; }

  /* ---------- Recent links ---------- */
  .recent { margin-top: 3rem; }
  .recent h2 { font-size: 1.15rem; margin: 0 0 .75rem; }
  .recent ul { list-style: none; margin: 0; padding: 0; }
  .recent li { display: flex; align-items: center; gap: .75rem; padding: .8rem 0; border-top: 1px solid rgba(255, 255, 255, .18); }
  .recent li.fresh { animation: slideIn .5s cubic-bezier(.2, .8, .3, 1) both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  .recent .info { flex: 1; min-width: 0; }
  .recent .info a { display: block; font-family: var(--mono); font-size: .9rem; font-weight: 600; color: var(--gold); overflow-wrap: anywhere; }
  .recent .info span {
    display: block; font-family: var(--mono); font-size: .8rem; color: rgba(255, 255, 255, .62);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .recent button.ghost { color: #fff; border-color: rgba(255, 255, 255, .5); }
  .recent button.ghost:hover { background: #fff; color: var(--ink); }
  .empty { color: rgba(255, 255, 255, .65); }

  @media (max-width: 30rem) { .row { flex-direction: column; } }
  @media (prefers-reduced-motion: reduce) {
    .blob, .rise, .caret, .result.reveal, .result.reveal::before, .result.reveal .short, .recent li.fresh, button:disabled { animation: none !important; }
    button, button::after, input[type="text"] { transition: none; }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<main>
  <div class="brand rise"><i aria-hidden="true"></i>Snip</div>

  <h1 class="rise" style="--d:.08s">Long links, made short.</h1>
  <p class="lede rise" style="--d:.16s">Paste any web address and get a short link that sends people to it.</p>

  <div class="demo rise" style="--d:.24s" aria-hidden="true"><span class="demo-text" id="demo-text"></span><span class="caret"></span></div>

  <form id="shorten-form" class="card rise" style="--d:.34s" novalidate>
    <label for="url">Web address</label>
    <div class="row">
      <input type="text" id="url" name="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://example.com/a/very/long/page">
      <button type="submit" id="submit">Shorten link</button>
    </div>
    <p class="error" id="error" role="alert"></p>
  </form>

  <section class="result" id="result" hidden aria-live="polite">
    <h2>Your short link</h2>
    <a class="short" id="short-link" href="#" target="_blank" rel="noopener"></a>
    <p class="original" id="original"></p>
    <button type="button" class="ghost" id="copy">Copy link</button>
  </section>

  <section class="recent" aria-labelledby="recent-title">
    <h2 id="recent-title">Recent links</h2>
    <ul id="recent-list"></ul>
    <p class="empty" id="recent-empty">Links you shorten in this browser show up here.</p>
  </section>
</main>

<script>
  // 1) After you create the HTTP API, paste its Invoke URL here (no trailing slash).
  //    Example: https://abc123.execute-api.us-east-1.amazonaws.com
  const API_URL = "PASTE_YOUR_API_URL_HERE";

  const STORAGE_KEY = "snip-recent-links";
  const MAX_RECENT = 5;
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const form = document.getElementById("shorten-form");
  const input = document.getElementById("url");
  const submitBtn = document.getElementById("submit");
  const errorEl = document.getElementById("error");
  const resultEl = document.getElementById("result");
  const shortLink = document.getElementById("short-link");
  const originalEl = document.getElementById("original");
  const copyBtn = document.getElementById("copy");
  const recentList = document.getElementById("recent-list");
  const recentEmpty = document.getElementById("recent-empty");

  function normalize(raw) {
    let value = raw.trim();
    if (!value) return "";
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) value = "https://" + value;
    return value;
  }

  function isValidUrl(value) {
    try {
      const u = new URL(value);
      return (u.protocol === "http:" || u.protocol === "https:") && u.hostname.includes(".");
    } catch (e) {
      return false;
    }
  }

  async function copyText(text) {
    // S3 website endpoints are plain HTTP, where navigator.clipboard is unavailable,
    // so fall back to a hidden textarea.
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fall through */ }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  function flash(button, text) {
    const original = button.dataset.label || button.textContent;
    button.dataset.label = original;
    button.textContent = text;
    setTimeout(() => { button.textContent = original; }, 1600);
  }

  function loadRecent() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function saveRecent(entry) {
    const list = loadRecent().filter((item) => item.shortUrl !== entry.shortUrl);
    list.unshift(entry);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, MAX_RECENT)));
    } catch (e) { /* storage may be unavailable; ignore */ }
  }

  function renderRecent(highlightFirst) {
    const list = loadRecent();
    recentList.replaceChildren();
    recentEmpty.hidden = list.length > 0;
    list.forEach((item, index) => {
      const li = document.createElement("li");
      if (highlightFirst && index === 0) li.className = "fresh";

      const info = document.createElement("div");
      info.className = "info";
      const a = document.createElement("a");
      a.href = item.shortUrl;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = item.shortUrl;
      const span = document.createElement("span");
      span.textContent = item.longUrl;
      info.append(a, span);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ghost";
      btn.textContent = "Copy";
      btn.addEventListener("click", async () => {
        const ok = await copyText(item.shortUrl);
        flash(btn, ok ? "Copied" : "Press Ctrl+C");
      });

      li.append(info, btn);
      recentList.append(li);
    });
  }

  // Small burst of colored dots from the tape when a link is created.
  function burst() {
    if (REDUCED || !resultEl.animate) return;
    const colors = ["#f5c451", "#19c6c0", "#2f6bff", "#8a4dff", "#ffd9a0"];
    const count = 16;
    for (let i = 0; i < count; i++) {
      const s = document.createElement("span");
      s.className = "spark";
      s.style.background = colors[i % colors.length];
      resultEl.appendChild(s);
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const dist = 50 + Math.random() * 70;
      const anim = s.animate(
        [
          { transform: "translate(0, 0) scale(1)", opacity: 1 },
          { transform: "translate(" + Math.cos(angle) * dist + "px, " + Math.sin(angle) * dist + "px) scale(0)", opacity: 0 }
        ],
        { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.2,.8,.3,1)" }
      );
      anim.onfinish = () => s.remove();
    }
  }

  function showResult(shortUrl, longUrl) {
    shortLink.href = shortUrl;
    shortLink.textContent = shortUrl;
    originalEl.textContent = longUrl;
    resultEl.hidden = false;
    resultEl.classList.remove("reveal");
    void resultEl.offsetWidth; // restart the animation
    resultEl.classList.add("reveal");
    burst();
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorEl.textContent = "";

    if (API_URL.includes("PASTE_YOUR")) {
      errorEl.textContent = "Set API_URL at the bottom of index.html to your API’s Invoke URL.";
      return;
    }

    const longUrl = normalize(input.value);
    if (!isValidUrl(longUrl)) {
      errorEl.textContent = "Enter a full web address, like https://example.com/page.";
      input.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Shortening…";
    try {
      const res = await fetch(API_URL.replace(/\/+$/, "") + "/shorten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: longUrl })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "The link couldn’t be created. Try again.");

      showResult(data.shortUrl, longUrl);
      saveRecent({ shortUrl: data.shortUrl, longUrl: longUrl });
      renderRecent(true);
      input.value = "";
    } catch (err) {
      errorEl.textContent = err instanceof TypeError
        ? "Couldn’t reach the server. Check the API URL and that CORS is enabled."
        : err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Shorten link";
    }
  });

  copyBtn.addEventListener("click", async () => {
    const ok = await copyText(shortLink.textContent);
    flash(copyBtn, ok ? "Copied" : "Press Ctrl+C");
  });

  // ---------- Demo strip: types a long link, shrinks it, shows the short one ----------
  const samples = [
    { long: "https://www.example.com/blog/2026/11/how-to-build-a-serverless-app-on-aws?utm_source=newsletter&utm_medium=email", short: "sho.rt/aB3xY9" },
    { long: "https://docs.example.org/guides/getting-started/installation/linux/ubuntu#step-three-configure", short: "sho.rt/Qm7Kd2" },
    { long: "https://shop.example.net/products/category/electronics/headphones/wireless?sort=price&page=2", short: "sho.rt/Zp4Tn8" }
  ];
  const demoEl = document.getElementById("demo-text");
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  async function runDemo() {
    if (REDUCED) {
      demoEl.textContent = samples[0].short;
      demoEl.classList.add("is-short");
      return;
    }
    let i = 0;
    while (true) {
      const s = samples[i % samples.length];
      demoEl.classList.remove("is-short");
      for (let n = 1; n <= s.long.length; n += 3) { demoEl.textContent = s.long.slice(0, n); await sleep(18); }
      demoEl.textContent = s.long;
      await sleep(900);
      for (let n = s.long.length; n > 0; n -= 4) { demoEl.textContent = s.long.slice(0, n); await sleep(10); }
      demoEl.classList.add("is-short");
      for (let n = 1; n <= s.short.length; n++) { demoEl.textContent = s.short.slice(0, n); await sleep(70); }
      await sleep(2200);
      i++;
    }
  }

  renderRecent(false);
  runDemo();
</script>
</body>
</html>
